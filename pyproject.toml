[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "graphrag-lab"
version = "0.1.0"
description = "Local, reproducible GraphRAG experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "neo4j>=5.28,<6",
  "numpy>=1.26,<3",
  "sentence-transformers>=3.1,<4",
  "streamlit>=1.33,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "hatchling>=1.27,<2", "editables>=0.5,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
